name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      # Postgres backs the API server's repo store (internal/api/store). Store
      # tests connect directly via STACKIT_TEST_DATABASE_URL (no testcontainers
      # / Docker-in-Docker needed); other packages ignore it.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: stackit
          POSTGRES_PASSWORD: stackit
          POSTGRES_DB: stackit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stackit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git operations

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          check-latest: true

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        env:
          STACKIT_NO_LOGGING: "1"
          STACKIT_TEST_DATABASE_URL: postgres://stackit:stackit@localhost:5432/stackit_test?sslmode=disable
        run: |
          PACKAGES="$(bash scripts/go-test-packages.sh all)"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            go test -v -race -p=1 -parallel=2 -coverprofile=coverage.out $PACKAGES
          else
            go test -v -coverprofile=coverage.out $PACKAGES
          fi


  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          check-latest: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          mkdir -p bin
          go build -v -o bin/stackit ./apps/cli
          pnpm --filter @stackit/web build
          ./scripts/sync-web-static.sh
          go build -v -o bin/stackit-server ./apps/server
          if [ -d ./apps/st-tui ]; then
            go build -v -o bin/st-tui ./apps/st-tui
          elif [ -d ./cmd/st-tui ]; then
            go build -v -o bin/st-tui ./cmd/st-tui
          else
            echo "st-tui entrypoint not found (expected apps/st-tui or cmd/st-tui); skipping optional st-tui build"
          fi

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run tests
        run: pnpm --filter @stackit/web test

      - name: Typecheck
        run: pnpm --filter @stackit/web typecheck

      - name: Build web app
        run: pnpm --filter @stackit/web build
