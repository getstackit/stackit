version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  allow-parallel-runners: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - stackit.dev/stackit

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - goconst
    - unconvert
    - unparam
    - gosec
    - revive
    - gocritic
    - nilerr
    - bodyclose
    - prealloc
    - whitespace
    - errorlint
    - copyloopvar
    - tparallel
    - forbidigo
  settings:
    forbidigo:
      forbid:
        - pattern: '\.Git\(\)'
          msg: >-
            Do not reach through Engine.Git()/Context.Git() to the raw git
            runner. Add or use an engine method for domain operations. The only
            allowed uses are passing the runner to integration helpers (github,
            etc.), which must be annotated with //nolint:forbidigo and a reason.
    misspell:
      locale: US
    gosec:
      excludes:
        - G204
        - G304
        - G702
        - G703
        - G704
    revive:
      rules:
        - name: var-naming
          disabled: true
  exclusions:
    presets: []
    rules:
      # Auth cookies set Secure from CookieOptions (true behind HTTPS / public
      # mode, false for local-dev HTTP), so gosec's G124 fires on the literal.
      # G124 isn't in golangci-lint's config-schema enum for gosec.excludes
      # (config verify rejects it), so scope the exclusion here by path instead.
      - path: internal/api/auth/cookie\.go
        text: 'G124'
        linters:
          - gosec
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - goconst
      - path: _test\.go
        linters:
          - lll
      # Tests use Engine.Git() freely for setup/assertions.
      - path: _test\.go
        linters:
          - forbidigo
      # Bootstrap and core own the git runner: app/config wire it, engine
      # implements and returns it. The escape-hatch guard targets the
      # action/adapter/business layers.
      - path: internal/(app|config|engine)/
        linters:
          - forbidigo
      # TUI storyboard files contain fixture data with repeated string literals
      # that don't benefit from extraction into constants.
      - path: internal/tui/.*stories\.go
        linters:
          - goconst
      # Benchmark mock data file with many repeated fixture strings.
      - path: internal/tui/components/tree/tree_mock\.go
        linters:
          - goconst

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
