version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  allow-parallel-runners: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - stackit.dev/stackit

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - goconst
    - unconvert
    - unparam
    - gosec
    - revive
    - gocritic
    - nilerr
    - bodyclose
    - prealloc
    - whitespace
    - errorlint
    - copyloopvar
    - tparallel
    - forbidigo
    - depguard
  settings:
    depguard:
      rules:
        # Actions are reusable business operations; interaction goes through
        # prompt/handler interfaces implemented by the CLI/TUI adapters.
        actions-no-tui:
          files:
            - "**/internal/actions/**"
          deny:
            - pkg: github.com/getstackit/stackit/internal/tui
              desc: >-
                actions must not import the TUI adapter; define a prompt or
                handler interface next to the action and implement it in
                internal/cli (see docs/architecture.md).
    forbidigo:
      forbid:
        - pattern: '\.Git\(\)'
          msg: >-
            Engine and app.Context do not expose the raw git runner. Add or use
            an engine method for domain operations; the GitHub integration gets
            its narrow runner from app.Context.GHRunner.
        - pattern: '^config\.Load\w*$'
          msg: >-
            Actions must not load config from disk. Resolve it in bootstrap
            (internal/app) or the adapter (internal/cli, internal/api) and pass
            the values in the request/options.
    misspell:
      locale: US
    gosec:
      excludes:
        - G204
        - G304
        - G702
        - G703
        - G704
    revive:
      rules:
        - name: var-naming
          disabled: true
  exclusions:
    presets: []
    rules:
      # Auth cookies set Secure from CookieOptions (true behind HTTPS / public
      # mode, false for local-dev HTTP), so gosec's G124 fires on the literal.
      # G124 isn't in golangci-lint's config-schema enum for gosec.excludes
      # (config verify rejects it), so scope the exclusion here by path instead.
      - path: internal/api/auth/cookie\.go
        text: 'G124'
        linters:
          - gosec
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - goconst
      - path: _test\.go
        linters:
          - lll
      # Tests may reach raw git (scenario.Git) for setup/assertions.
      - path: _test\.go
        linters:
          - forbidigo
      # Bootstrap and core own the git runner: app/config wire it, engine
      # wraps it. The guard targets the action/adapter/business layers.
      - path: internal/(app|config|engine)/
        linters:
          - forbidigo
      # Config loading is only forbidden in the action layer; bootstrap and
      # adapters are where it belongs.
      - path-except: ^internal/actions/
        text: Actions must not load config
        linters:
          - forbidigo
      # TUI storyboard files contain fixture data with repeated string literals
      # that don't benefit from extraction into constants.
      - path: internal/tui/.*stories\.go
        linters:
          - goconst
      # st-tui lab scenario files contain fixture data with repeated string
      # literals that don't benefit from extraction into constants.
      - path: apps/st-tui/.*_scenarios\.go
        linters:
          - goconst
      # Benchmark mock data file with many repeated fixture strings.
      - path: internal/tui/components/tree/tree_mock\.go
        linters:
          - goconst

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
