[settings]
experimental = true

[env]
STACKIT_NO_LOGGING = "1"                                    # Used for tests
# Postgres connection strings for the API server's repo store (apps/server).
# `db:up` starts a matching local Postgres via docker-compose. Tests target the
# _test database; see internal/api/store/testpostgres.
STACKIT_DATABASE_URL = "postgres://stackit:stackit@localhost:5432/stackit?sslmode=disable"
STACKIT_TEST_DATABASE_URL = "postgres://stackit:stackit@localhost:5432/stackit_test?sslmode=disable"
GOBIN = "{{ config_root }}/bin"
PROJECT_ROOT = "{{ config_root }}"
_.path = ["{{ config_root }}/bin", "{{ env.HOME }}/go/bin"]
# Local secrets / OAuth config for `mise run dev`. .env is gitignored; see
# .env.template for the full list of variables. Missing file is tolerated.
_.file = ".env"

[tools]
# Go toolchain
go = "1.26"
node = "22"
pnpm = "10.32.1"

# Test runner with prettier output
"go:gotest.tools/gotestsum" = "latest"

# Code formatting
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:github.com/DarthSim/overmind/v2" = "latest"

# Linting
# Pinned (not "latest") so local matches CI exactly — a drift here means lint
# passes locally but fails in CI (or vice versa). Keep in sync with the
# golangci-lint-action version in .github/workflows/{test,release}.yml.
golangci-lint = "2.11.3"

# Development tools
"aqua:watchexec/watchexec" = "latest"   # File watcher for dev auto-reload
"aqua:goreleaser/goreleaser" = "latest" # Release automation
"aqua:sqlc-dev/sqlc" = "latest"         # Type-safe SQL codegen for the repo store

# CLI utilities (recommended in AGENTS.md)
"aqua:BurntSushi/ripgrep" = "latest" # Fast text search (rg)
"aqua:sharkdp/fd" = "latest"         # Fast file search
"aqua:ast-grep/ast-grep" = "latest"  # AST-based code search
"aqua:jqlang/jq" = "latest"          # JSON processing
"aqua:mikefarah/yq" = "latest"       # YAML processing
"cargo:tokei" = "latest"             # Code statistics

[tasks.compile]
description = "Check compilation only (~2s)"
run = "go build ./..."

[tasks."db:up"]
description = "Start the local Postgres for the API server repo store"
run = "docker compose up -d postgres"

[tasks."db:down"]
description = "Stop the local Postgres (preserves the data volume)"
run = "docker compose down"

[tasks."sqlc:generate"]
description = "Regenerate the repo store query code from SQL (internal/api/store/reposdb)"
run = "sqlc generate"

[tasks.deps]
description = "Download dependencies for all modules"
run = """
  go mod download
  go mod tidy
"""

[tasks.build]
description = "Build CLI and server binaries with local version info"
run = """
  mkdir -p bin
  COMMIT=$(git rev-parse --short HEAD)
  DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
  LDFLAGS="-X main.version=dev-local -X main.commit=$COMMIT -X main.date=$DATE"
  go build -ldflags "$LDFLAGS" -o bin/stackit ./apps/cli
  ./scripts/sync-web-static.sh
  go build -ldflags "$LDFLAGS" -o bin/stackit-server ./apps/server
  if [ -d ./apps/st-tui ]; then
    go build -o bin/st-tui ./apps/st-tui
  fi
  if [ ! -L ./bin/st ] && [ ! -f ./bin/st ]; then
    ln -s stackit ./bin/st
    echo "Created symlink: bin/st -> stackit"
  fi
"""

[tasks.fmt]
description = "Format code"
run = "goimports -w ."

[tasks.lint]
description = "Run linter"
run = "golangci-lint run --allow-parallel-runners"

[tasks."lint:fix"]
description = "Run linter and fix issues"
run = "golangci-lint run --allow-parallel-runners --fix"

[tasks.test]
description = "Run all tests (with caching for faster repeated runs)"
run = """
  PACKAGES=$(bash scripts/go-test-packages.sh all)
  gotestsum --format pkgname-and-test-fails -- $PACKAGES
"""

[tasks."test:fresh"]
description = "Run all tests without caching"
run = """
  PACKAGES=$(bash scripts/go-test-packages.sh all)
  gotestsum --format pkgname-and-test-fails -- $PACKAGES -count=1
"""

[tasks."test:verbose"]
description = "Run tests with verbose output"
run = """
  PACKAGES=$(bash scripts/go-test-packages.sh all)
  gotestsum --format standard-verbose -- $PACKAGES
"""

[tasks."test:coverage"]
description = "Run tests with coverage"
run = """
  PACKAGES=$(bash scripts/go-test-packages.sh all)
  gotestsum --format pkgname-and-test-fails -- -coverprofile=coverage.out $PACKAGES
  go tool cover -html=coverage.out -o coverage.html
"""

[tasks."test:race"]
description = "Run tests with race detection"
run = """
  PACKAGES=$(bash scripts/go-test-packages.sh all)
  gotestsum --format pkgname-and-test-fails -- -race $PACKAGES
"""

[tasks."test:pkg"]
description = "Run tests for a specific package"
usage = '''
arg "package" help="Package to test (e.g. ./testhelpers)"
'''
run = "gotestsum --format standard-verbose -- {{arg(name='package')}}"

[tasks."test:unit"]
description = "Run low-IO Go unit tests only"
run = """
  PACKAGES=$(bash scripts/go-test-packages.sh unit)
  gotestsum --format pkgname-and-test-fails -- $PACKAGES
"""

[tasks."test:fast"]
description = "Run fast Go tests without git-scenario or integration packages"
run = """
  PACKAGES=$(bash scripts/go-test-packages.sh fast)
  gotestsum --format pkgname-and-test-fails -- $PACKAGES
"""

[tasks."test:git"]
description = "Run git-backed scenario tests outside the integration tree"
run = """
  PACKAGES=$(bash scripts/go-test-packages.sh git)
  gotestsum --format pkgname-and-test-fails -- $PACKAGES
"""

[tasks."test:integration"]
description = "Run integration tests only"
run = """
  PACKAGES=$(bash scripts/go-test-packages.sh integration)
  gotestsum --format pkgname-and-test-fails -- $PACKAGES
"""

[tasks.clean]
description = "Clean built binaries, shims, and test artifacts"
run = """
  rm -f coverage.out coverage.html
  rm -rf bin/
  rm -f ./stackit ./st
  find . -type d -name "stackit-test-*" -exec rm -rf {} + 2>/dev/null || true
  echo "Cleaned: binaries (bin/), shims (./stackit, ./st), and test artifacts"
"""

[tasks.check]
description = "Run all checks (Go format, lint, all Go tests + web tests, typecheck, build)"
depends = ["fmt", "lint", "test", "check:web"]

[tasks."check:go"]
description = "Run all Go checks (format, lint, all Go tests)"
depends = ["fmt", "lint", "test"]

[tasks."web:install"]
description = "Install frontend workspace dependencies"
run = "pnpm install"

[tasks."web:dev"]
description = "Run the web app in development mode"
run = "pnpm --filter @stackit/web dev"

[tasks."dev:server"]
description = "Run the server in development mode (auto-reloads on file changes)"
run = "watchexec -r -e go -w apps/server -w internal -w api -- go run ./apps/server --port 8080"

[tasks."env:init"]
description = "Generate .env from .env.template, filling values from gh CLI + openssl where possible"
run = """
  set -e
  if [ -f .env ]; then
    echo ".env already exists. Remove it first to regenerate, or edit it by hand." >&2
    exit 1
  fi
  if [ ! -f .env.template ]; then
    echo ".env.template not found at project root." >&2
    exit 1
  fi
  if ! command -v gh >/dev/null 2>&1; then
    echo "gh CLI not found. Install from https://cli.github.com." >&2
    exit 1
  fi
  if ! gh auth status >/dev/null 2>&1; then
    echo "gh not authenticated. Run 'gh auth login' first." >&2
    exit 1
  fi
  if ! command -v openssl >/dev/null 2>&1; then
    echo "openssl not found." >&2
    exit 1
  fi

  GH_USER=$(gh api user --jq .login)
  SESSION_KEY=$(openssl rand -base64 32)

  awk -v user="$GH_USER" -v key="$SESSION_KEY" '
    /^STACKIT_ALLOWED_GH_USERS=$/ { print "STACKIT_ALLOWED_GH_USERS=" user; next }
    /^STACKIT_SESSION_KEY=$/      { print "STACKIT_SESSION_KEY=" key; next }
    { print }
  ' .env.template > .env

  echo "Wrote .env with:"
  echo "  STACKIT_ALLOWED_GH_USERS=$GH_USER  (from gh api user)"
  echo "  STACKIT_SESSION_KEY=<32 random bytes>"
  echo
  echo "Still required for public-mode auth (manual — GitHub does not expose these via API):"
  echo "  STACKIT_GITHUB_CLIENT_ID"
  echo "  STACKIT_GITHUB_CLIENT_SECRET"
  echo
  echo "Create an OAuth app at https://github.com/settings/developers and set"
  echo "the callback URL to \\$STACKIT_BASE_URL/auth/callback, then paste the"
  echo "credentials into .env."
"""

[tasks."server:build:embedded"]
description = "Build stackit-server with embedded exported web assets"
depends = ["web:sync-static"]
run = """
  mkdir -p bin
  COMMIT=$(git rev-parse --short HEAD)
  DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
  LDFLAGS="-X main.version=dev-local -X main.commit=$COMMIT -X main.date=$DATE"
  go build -ldflags "$LDFLAGS" -o bin/stackit-server ./apps/server
"""

[tasks."server:run:embedded"]
description = "Build and run stackit-server with embedded exported web assets"
depends = ["server:build:embedded"]
run = """
  PORT="${STACKIT_SERVER_PORT:-8080}"
  CWD="${STACKIT_SERVER_CWD:-}"

  if lsof -nP -tiTCP:"$PORT" -sTCP:LISTEN >/dev/null 2>&1; then
    echo "Port $PORT is already in use." >&2
    echo "Stop the existing listener or rerun with STACKIT_SERVER_PORT set to another port." >&2
    echo "Example: STACKIT_SERVER_PORT=9090 mise run server:run:embedded" >&2
    lsof -nP -iTCP:"$PORT" -sTCP:LISTEN >&2 || true
    exit 1
  fi

  set -- ./bin/stackit-server --port "$PORT"
  if [ -n "$CWD" ]; then
    set -- "$@" --cwd "$CWD"
  fi

  exec "$@"
"""

[tasks.dev]
description = "Run server + web dev servers using overmind and Procfile.dev"
run = "overmind start -f Procfile.dev"

[tasks."dev:stop"]
description = "Stop the overmind dev process group and clean up orphaned backend listeners"
run = """
  overmind quit -s .overmind.sock 2>/dev/null || true

  PIDS=$(lsof -nP -tiTCP:8080 -sTCP:LISTEN 2>/dev/null || true)
  if [ -z "$PIDS" ]; then
    exit 0
  fi

  for PID in $PIDS; do
    CWD=$(lsof -a -p "$PID" -d cwd -Fn 2>/dev/null | sed -n 's/^n//p' | head -n 1)
    if [ "$CWD" != "$PROJECT_ROOT" ]; then
      continue
    fi

    PGID=$(ps -p "$PID" -o pgid= 2>/dev/null | tr -d ' ')
    if [ -z "$PGID" ]; then
      kill -TERM "$PID" 2>/dev/null || true
      continue
    fi

    kill -TERM -- "-$PGID" 2>/dev/null || true
  done

  sleep 2

  PIDS=$(lsof -nP -tiTCP:8080 -sTCP:LISTEN 2>/dev/null || true)
  for PID in $PIDS; do
    CWD=$(lsof -a -p "$PID" -d cwd -Fn 2>/dev/null | sed -n 's/^n//p' | head -n 1)
    if [ "$CWD" != "$PROJECT_ROOT" ]; then
      continue
    fi

    PGID=$(ps -p "$PID" -o pgid= 2>/dev/null | tr -d ' ')
    if [ -z "$PGID" ]; then
      kill -KILL "$PID" 2>/dev/null || true
      continue
    fi

    kill -KILL -- "-$PGID" 2>/dev/null || true
  done
"""

[tasks."web:build"]
description = "Build the web app"
run = "pnpm --filter @stackit/web build"

[tasks."web:sync-static"]
description = "Copy built web assets into the server static directory"
depends = ["web:build"]
run = "./scripts/sync-web-static.sh"

[tasks."web:test"]
description = "Run frontend tests"
run = "pnpm --filter @stackit/web test"

[tasks."check:web"]
description = "Run frontend tests, type checks, and build"
run = """
  pnpm --filter @stackit/web test
  pnpm --filter @stackit/web typecheck
  pnpm --filter @stackit/web build
"""

[tasks.shims]
description = "Install shims to repo root for local development"
depends = ["build"]
run = """
  cp scripts/stackit-shim.sh ./stackit
  cp scripts/st-shim.sh ./st
  chmod +x ./stackit ./st
  echo "Dev shims installed to repo root"
"""

[tasks.init]
description = "Initialize stackit in this repository"
depends = ["build"]
run = "./bin/stackit init"
